apiVersion: v1
kind: Service
metadata:
  name: datamart
  namespace: mlops
spec:
  selector: {app: datamart}
  ports:
    - {name: http, port: 8090, targetPort: 8090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamart
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels: {app: datamart}
  template:
    metadata:
      labels: {app: datamart}
    spec:
      serviceAccountName: spark   
      enableServiceLinks: false
      containers:
        - name: datamart
          image: mlops/datamart:lab7
          imagePullPolicy: IfNotPresent
          workingDir: /app/work     
          ports:
            - {name: http, containerPort: 8090}
            - {name: spark-ui, containerPort: 4040}
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: JAVA_OPTS
              value: >-
                -Xmx1g
                -Dspark.driver.host=$(POD_IP)
                -Dspark.kubernetes.driver.pod.name=$(POD_NAME)
                -Dspark.dynamicAllocation.enabled=true
                -Dspark.dynamicAllocation.shuffleTracking.enabled=true
                -Dspark.dynamicAllocation.minExecutors=0
                -Dspark.dynamicAllocation.maxExecutors=2
                -Dspark.dynamicAllocation.executorIdleTimeout=60s
                -Dspark.dynamicAllocation.cachedExecutorIdleTimeout=120s
                -Dspark.dynamicAllocation.shuffleTracking.timeout=120s
            - name: SPARK_MASTER
              value: k8s://https://kubernetes.default.svc:443
            - {name: SPARK_CONF_DIR, value: /opt/spark/conf}
            - {name: MSSQL_HOST, value: mssql}
            - name: MSSQL_USER
              valueFrom:
                secretKeyRef: {name: mssql-credentials, key: MSSQL_USER}
            - name: MSSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: mssql-credentials, key: MSSQL_PASSWORD}
          resources:
            requests: {cpu: 250m, memory: 1Gi}   
            limits: {memory: 1536Mi}             
          readinessProbe:
            httpGet: {path: /health, port: 8090}
            periodSeconds: 5
          startupProbe:            
            httpGet: {path: /health, port: 8090}
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - {name: spark-conf, mountPath: /opt/spark/conf}
            - {name: work, mountPath: /app/work}
      volumes:
        - name: spark-conf
          configMap: {name: spark-defaults}
        - name: work
          persistentVolumeClaim: {claimName: mlops-work}

# Конфиг модели лабы 7 для кластера. Подменяет src/config.json внутри образа.
# Отличия от src/config.json:
#   driver_memory_min/max_gb = 1 — под видит RAM всей ноды, а не свой лимит, поэтому память задаём явно
#   cores = 2                    — по числу executor'ов (spark-defaults: 2 × 1 ядро), от него считаются партиции
#   datamart.url                 — имя Service витрины в кластере (DATAMART_URL из Job'а важнее)
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: mlops
data:
  config.json: |
    {
      "spark": {
        "app_name": "openfoodfacts-kmeans",
        "ram_fraction": 0.4,
        "driver_memory_min_gb": 1,
        "driver_memory_max_gb": 1,
        "cores": 2,
        "shuffle_partitions_per_core": 2,
        "log_level": "WARN"
      },
      "model": {
        "model_path": "models/kmeans",
        "scaler_path": "models/scaler",
        "predictions_path": "data/processed/predictions.parquet",
        "k_min": 2,
        "k_max": 10
      },
      "datamart": {
        "url": "http://datamart:8090",
        "timeout_sec": 900,
        "startup_retries": 60
      }
    }

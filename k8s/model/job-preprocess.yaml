# Лаба 7: предобработку делает витрина (сырой CSV -> очистка -> выборка -> raw.processed_data).
# Модель в ней больше не участвует, поэтому Job просто вызывает HTTP-эндпоинт витрины.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-preprocess
  namespace: mlops
  labels: {app: model}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: model, command: preprocess}
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          # --fail-with-body: при ответе 4xx/5xx Job падает, а ответ витрины остаётся в логах
          args:
            - --silent
            - --show-error
            - --fail-with-body
            - --max-time
            - "900"
            - -X
            - POST
            - http://datamart:8090/v1/preprocess
            - -d
            - "{}"
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}

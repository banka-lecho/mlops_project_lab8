apiVersion: batch/v1
kind: Job
metadata:
  name: model-preprocess
  namespace: mlops
  labels: {app: model}
spec:
  backoffLimit: 0             # упал — не перезапускать, смотрим логи
  template:
    metadata:
      labels: {app: model, command: preprocess}
    spec:
      serviceAccountName: spark   
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: driver
          image: mlops/model:lab6
          imagePullPolicy: IfNotPresent
          args: ["python", "/app/src/main.py", "preprocess"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: SPARK_MASTER
              value: k8s://https://kubernetes.default.svc:443
            - name: PYSPARK_SUBMIT_ARGS
              value: >-
                --conf spark.driver.host=$(POD_IP)
                --conf spark.kubernetes.driver.pod.name=$(POD_NAME)
                pyspark-shell
            - {name: MSSQL_HOST, value: mssql}
            - name: MSSQL_USER
              valueFrom:
                secretKeyRef: {name: mssql-credentials, key: MSSQL_USER}
            - name: MSSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: mssql-credentials, key: MSSQL_PASSWORD}
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {memory: 2Gi}   
          volumeMounts:
            - {name: spark-conf, mountPath: /opt/spark/conf}
            - {name: config, mountPath: /app/src/config.json, subPath: config.json}
            - {name: work, mountPath: /app/work}
      volumes:
        - name: spark-conf
          configMap: {name: spark-defaults}
        - name: config
          configMap: {name: model-config}
        - name: work
          persistentVolumeClaim: {claimName: mlops-work}

# Модель лабы 5, шаг «preprocess» — предобработка: сырой CSV -> очистка -> выборка -> parquet.
# Под Job — драйвер Spark, executor'ов он поднимает сам (настройки в spark-defaults).
apiVersion: batch/v1
kind: Job
metadata:
  name: model-preprocess
  namespace: mlops
  labels: {app: model}
spec:
  backoffLimit: 0             # упал — не перезапускать, смотрим логи
  template:
    metadata:
      labels: {app: model, command: preprocess}
    spec:
      serviceAccountName: spark   # права создавать поды executor'ов
      restartPolicy: Never
      containers:
        - name: driver
          image: mlops/model:lab5
          imagePullPolicy: IfNotPresent
          args: ["python", "/app/src/preprocess.py"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # Без этой переменной модель работает в local mode, как в лабе 5
            - name: SPARK_MASTER
              value: k8s://https://kubernetes.default.svc:443
            - name: PYSPARK_SUBMIT_ARGS
              value: >-
                --conf spark.driver.host=$(POD_IP)
                --conf spark.kubernetes.driver.pod.name=$(POD_NAME)
                pyspark-shell
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {memory: 2Gi}   # driver 1g из конфига + память самого Python
          volumeMounts:
            - {name: spark-conf, mountPath: /opt/spark/conf}
            - {name: config, mountPath: /app/src/config.json, subPath: config.json}
            - {name: work, mountPath: /app/work}
      volumes:
        - name: spark-conf
          configMap: {name: spark-defaults}
        - name: config
          configMap: {name: model-config}
        - name: work
          persistentVolumeClaim: {claimName: mlops-work}

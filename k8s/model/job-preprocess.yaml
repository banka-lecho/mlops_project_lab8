apiVersion: batch/v1
kind: Job
metadata:
  name: model-preprocess
  namespace: mlops
  labels: {app: model}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: model, command: preprocess}
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          args:
            - --silent
            - --show-error
            - --fail-with-body
            - --max-time
            - "900"
            - -X
            - POST
            - http://datamart:8090/v1/preprocess
            - -d
            - '{"rawPath": "data/raw/products_100k.csv"}'
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}

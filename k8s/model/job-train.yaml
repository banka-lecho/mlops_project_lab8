apiVersion: batch/v1
kind: Job
metadata:
  name: model-train
  namespace: mlops
  labels: {app: model}
spec:
  backoffLimit: 0             
  template:
    metadata:
      labels: {app: model, command: train}
    spec:
      serviceAccountName: spark   
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: driver
          image: mlops/model:lab7
          imagePullPolicy: IfNotPresent
          args: ["train"]   
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: SPARK_MASTER
              value: k8s://https://kubernetes.default.svc:443
            - name: SPARK_UI_HOLD_SEC
              value: "0"
            - name: PYSPARK_SUBMIT_ARGS
              value: >-
                --conf spark.driver.host=$(POD_IP)
                --conf spark.kubernetes.driver.pod.name=$(POD_NAME)
                pyspark-shell
            - {name: DATAMART_URL, value: "http://datamart:8090"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}   
            limits: {memory: 1536Mi}   
          volumeMounts:
            - {name: spark-conf, mountPath: /opt/spark/conf}
            - {name: work, mountPath: /app/work}
      volumes:
        - name: spark-conf
          configMap: {name: spark-defaults}
        - name: work
          persistentVolumeClaim: {claimName: mlops-work}

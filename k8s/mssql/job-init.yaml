apiVersion: batch/v1
kind: Job
metadata:
  name: mssql-init
  namespace: mlops
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: mssql-init}
    spec:
      restartPolicy: Never
      containers:
        - name: sqlcmd
          image: mcr.microsoft.com/mssql/server:2022-latest   
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              until /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null; do
                echo "Жду MS SQL..."; sleep 5
              done
              /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -b -i /schema/schema.sql
              echo "Схема применена"
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: {name: mssql-credentials, key: MSSQL_SA_PASSWORD}
          volumeMounts:
            - {name: schema, mountPath: /schema}
      volumes:
        - name: schema
          configMap: {name: mssql-schema}  

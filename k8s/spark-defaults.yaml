apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-defaults
  namespace: mlops
data:
  spark-defaults.conf: |
    spark.submit.deployMode                  client
    spark.kubernetes.namespace               mlops
    spark.kubernetes.container.image         mlops/spark-py:4.2.0
    spark.kubernetes.container.image.pullPolicy IfNotPresent

    # Репликация вычислителей: сколько подов-executor'ов поднимает каждое приложение
    spark.executor.instances                 2
    spark.executor.cores                     1
    # 512m кучи + 384m служебной памяти = под 896Mi. С кучей 1g пик executor'а был 677Mi, 1408Mi не нужны
    spark.executor.memory                    512m
    spark.kubernetes.executor.request.cores  500m
    spark.kubernetes.executor.limit.cores    1

    # Spark UI на порту 4040 драйвера (витрина в коде его выключает, здесь включаем для k8s)
    spark.ui.enabled                         true

    # Executor'ы подключаются к драйверу по IP его пода на фиксированные порты
    spark.driver.bindAddress                 0.0.0.0
    spark.driver.port                        7078
    spark.driver.blockManager.port           7079

    # Тот же рабочий каталог, что и у драйвера
    spark.kubernetes.executor.volumes.persistentVolumeClaim.work.options.claimName mlops-work
    spark.kubernetes.executor.volumes.persistentVolumeClaim.work.mount.path       /app/work
    spark.kubernetes.executor.volumes.persistentVolumeClaim.work.mount.readOnly   false

apiVersion: v1
kind: ServiceAccount # Учётная запись spark, от имени которой работает драйвер
metadata:
  name: spark       # имя учётной записи
  namespace: mlops  # существует только в mlops
---
apiVersion: rbac.authorization.k8s.io/v1    # раздел API для прав
kind: Role                                  # Можно создавать, смотреть и удалять поды и ConfigMap'ы
metadata:
  name: spark-driver
  namespace: mlops                          # права только на объекты в mlops
rules:
  - apiGroups: [""]                         # "" = базовый раздел API (v1): там поды, ConfigMap'ы...
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"] # над чем
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete", "deletecollection"]  # какие действия
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding           # spark получает роль spark-driver
metadata:
  name: spark-driver
  namespace: mlops
subjects:                   # КОМУ выдаём
  - kind: ServiceAccount
    name: spark
    namespace: mlops
roleRef:                    # КАКУЮ роль
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver

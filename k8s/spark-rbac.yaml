apiVersion: v1
kind: ServiceAccount 
metadata:
  name: spark       
  namespace: mlops  
---
apiVersion: rbac.authorization.k8s.io/v1    
kind: Role                                  
metadata:
  name: spark-driver
  namespace: mlops                          
rules:
  - apiGroups: [""]                         
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"] 
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete", "deletecollection"]  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding           
metadata:
  name: spark-driver
  namespace: mlops
subjects:                  
  - kind: ServiceAccount
    name: spark
    namespace: mlops
roleRef:                    
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
